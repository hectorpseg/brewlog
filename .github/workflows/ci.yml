name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Build-safe placeholders: all pages are dynamic, so the build never
      # contacts Supabase. Real keys stay in .env.local / repo secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Failure contract for the backup CLI: without credentials it must
      # fail clearly with a non-zero exit and create no new files
      # (before/after comparison, so a pre-existing exports/ dir is fine).
      - name: backup CLI failure contract
        run: |
          before=$(ls exports 2>/dev/null | wc -l)
          if BREWLOG_EMAIL=nobody@example.com BREWLOG_PASSWORD=wrong-password-123 pnpm brewlog:export; then
            echo "brewlog:export should have failed without valid credentials"
            exit 1
          fi
          after=$(ls exports 2>/dev/null | wc -l)
          [ "$before" = "$after" ]

  audit:
    runs-on: ubuntu-latest
    # Advisory only: reports vulnerable deps without breaking builds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  migration-drift:
    runs-on: ubuntu-latest
    # Compares supabase/migrations against the hosted database. Needs a
    # SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF repo secret; skipped
    # without them. Any diff output fails the job.
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx supabase@2.117.0 link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: check for migration drift
        run: |
          DIFF_FILE="$(mktemp)"
          pnpm dlx supabase@2.117.0 db diff --linked --schema public -f "$DIFF_FILE" > /dev/null
          if [ -s "$DIFF_FILE" ]; then
            echo "Migration drift detected: supabase/migrations is behind the hosted database."
            cat "$DIFF_FILE"
            exit 1
          fi
          echo "No migration drift."

  e2e:
    runs-on: ubuntu-latest
    # Real user + Supabase project required; skipped on forks / without secrets.
    if: ${{ secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' }}
    needs: checks
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - name: upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
